<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <g id="flame">
      <path d="M0,0 C-7,-6 -3,-12 0,-20 C2,-14 9,-9 5,-2 C4,0 2,1 0,0 z" fill="#eb6834" stroke="#000" stroke-width="1"/>
    </g>
    <linearGradient id="flush" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.55" stop-color="#fff"/>
      <stop offset="1" stop-color="#fbd3bf"/>
    </linearGradient>
  </defs>
  <rect width="720" height="260" fill="#fff"/>
  <g transform="translate(0 0)">
    <rect x="90" y="40" width="30" height="130" fill="#fbd3bf"/>
    <g fill="none" stroke="#000" stroke-width="1.5">
      <rect x="50" y="20" width="110" height="20" rx="10"/>
      <rect x="50" y="170" width="110" height="20" rx="10"/>
      <rect x="90" y="40" width="30" height="130"/>
      <line x1="105" y1="70" x2="105" y2="95" stroke-width="1.5" marker-end="url(#arr)"/>
      <line x1="172" y1="160" x2="212" y2="160" stroke-width="1"/>
    </g>
    <rect x="176" y="90" width="14" height="70" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <rect x="194" y="126" width="14" height="34" fill="#eb6834" stroke="#000" stroke-width="1.5"/>
    <use href="#flame" x="134" y="125"/>
    <g fill="#000" text-anchor="middle">
      <text x="120" y="214">flow decaying,</text>
      <text x="120" y="230">column heating</text>
    </g>
  </g>
  <g transform="translate(240 0)">
    <rect x="90" y="40" width="30" height="130" fill="#f39a6e"/>
    <g fill="none" stroke="#000" stroke-width="1.5">
      <rect x="50" y="20" width="110" height="20" rx="10"/>
      <rect x="50" y="170" width="110" height="20" rx="10"/>
      <rect x="90" y="40" width="30" height="130"/>
      <line x1="105" y1="150" x2="105" y2="62" stroke-width="2.5" marker-end="url(#arr)"/>
      <line x1="172" y1="160" x2="212" y2="160" stroke-width="1"/>
    </g>
    <rect x="176" y="90" width="14" height="70" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <rect x="194" y="56" width="14" height="104" fill="#eb6834" stroke="#000" stroke-width="1.5"/>
    <use href="#flame" x="134" y="125"/>
    <g fill="#000" text-anchor="middle">
      <text x="120" y="214">crossing: buoyancy exceeds</text>
      <text x="120" y="230">the head, upward surge</text>
    </g>
  </g>
  <g transform="translate(480 0)">
    <rect x="90" y="40" width="30" height="130" fill="url(#flush)"/>
    <g fill="none" stroke="#000" stroke-width="1.5">
      <rect x="50" y="20" width="110" height="20" rx="10"/>
      <rect x="50" y="170" width="110" height="20" rx="10"/>
      <rect x="90" y="40" width="30" height="130"/>
      <line x1="105" y1="122" x2="105" y2="96" stroke-width="1.5" marker-end="url(#arr)"/>
      <line x1="172" y1="160" x2="212" y2="160" stroke-width="1"/>
    </g>
    <rect x="176" y="90" width="14" height="70" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <rect x="194" y="88" width="14" height="72" fill="#eb6834" stroke="#000" stroke-width="1.5"/>
    <use href="#flame" x="134" y="125"/>
    <g fill="#000" text-anchor="middle">
      <text x="120" y="214">cold inflow flushes the</text>
      <text x="120" y="230">column, flow settles</text>
    </g>
  </g>
  <text x="20" y="252" fill="#000">Bars beside each channel: the head the plena offer (open) and the column's buoyancy (filled).</text>
</svg>
