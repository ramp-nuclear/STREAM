<text x="885" y="105" font-size="13">head; the flywheels keep</text>
<text x="885" y="122" font-size="13">the legs turning</text>
<text x="885" y="156" font-size="13">12.5 s: flow at 85 %,</text>
<text x="885" y="173" font-size="13">reactor trip</text>
<text x="885" y="190" font-size="13">13.0 s: rods start in</text>
<text x="885" y="224" font-size="13">39 s: flow at 30 %, the</text>
<text x="885" y="241" font-size="13">flapper opens; part of the</text>
<text x="885" y="258" font-size="13">riser water goes straight</text>
<text x="885" y="275" font-size="13">into the plenum</text>
<text x="20" y="420" font-size="15" font-weight="bold">(c) the reversal window</text>
<text x="20" y="438" fill="#555" font-size="13">190 s to 300 s</text>
