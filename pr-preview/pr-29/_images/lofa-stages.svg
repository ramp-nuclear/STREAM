<text x="340" y="480" font-size="13">the heated groups turn</text>
<text x="340" y="497" font-size="13">upward, hottest first:</text>
<text x="340" y="514" font-size="13">hot 192 s, normal 236 s,</text>
<text x="340" y="531" font-size="13">low 270 s</text>
<text x="340" y="565" font-size="13">bypass still down: the core</text>
<text x="340" y="582" font-size="13">recirculates within itself</text>
<text x="340" y="616" font-size="13">260 s: net core flow, and</text>
<text x="340" y="633" font-size="13">the pool's, through zero</text>
<text x="340" y="667" font-size="13">the legs still trickle forward</text>
<text x="565" y="420" font-size="15" font-weight="bold">(d) natural circulation</text>
<text x="565" y="438" fill="#555" font-size="13">after about 10 min, to the hour</text>
