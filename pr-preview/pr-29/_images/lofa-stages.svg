<text x="885" y="497" font-size="13">as shut</text>
<text x="885" y="514" font-size="13">626 s: leg flow backward,</text>
<text x="885" y="531" font-size="13">a leak only</text>
<text x="885" y="565" font-size="13">core up, pool down, flapper</text>
<text x="885" y="582" font-size="13">into the plenum: 1.5 kg/s</text>
<text x="885" y="599" font-size="13">at the hour</text>
<text x="885" y="633" font-size="13">the pool is the heat sink,</text>
