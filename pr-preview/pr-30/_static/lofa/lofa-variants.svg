<text x="340" y="78" font-size="13">leg B coasts down; its check</text>
<text x="340" y="95" font-size="13">valve shuts at about 40 s and</text>
<text x="340" y="112" font-size="13">holds back all but a 1 % leak</text>
<text x="340" y="146" font-size="13">leg A speeds up to about 1.34×</text>
<text x="340" y="163" font-size="13">its nominal flow</text>
<text x="340" y="197" font-size="13">core flow still down, at about</text>
<text x="340" y="214" font-size="13">two thirds of nominal</text>
<text x="340" y="248" font-size="13">two thirds is below the 85 %</text>
<text x="340" y="265" font-size="13">setpoint: reactor trip at 15.7 s</text>
<text x="340" y="299" font-size="13">above 30 %: the flapper stays shut</text>
<text x="565" y="28" font-size="15" font-weight="bold">(b) stuck flapper</text>
<text x="565" y="46" fill="#555" font-size="13">both pumps trip, the flapper cannot open</text>
