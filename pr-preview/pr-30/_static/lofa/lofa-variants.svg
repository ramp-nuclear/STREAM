<text x="885" y="78" font-size="13">hot group reverses at 292 s,</text>
<text x="885" y="95" font-size="13">normal at 342 s; low and</text>
<text x="885" y="112" font-size="13">bypass stay down: the core</text>
<text x="885" y="129" font-size="13">recirculates within itself</text>
<text x="885" y="163" font-size="13">no path to the pool, only</text>
<text x="885" y="180" font-size="13">the check valves' leak</text>
<text x="885" y="214" font-size="13">409 s: bulk saturation in the</text>
<text x="885" y="231" font-size="13">hot channel; the model stops</text>
<text x="885" y="248" font-size="13">there by design</text>
