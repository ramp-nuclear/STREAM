<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 590" width="1090" height="590" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="e" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
