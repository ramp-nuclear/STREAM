<text x="138" y="376" text-anchor="end" font-weight="bold">Bottom</text>
<text x="178" y="224" font-weight="bold">Channel</text>
<text x="178" y="240" fill="#555">edge Top → Bottom</text>
<text x="275" y="414" text-anchor="middle" fill="#555">edge Bottom → Top</text>
