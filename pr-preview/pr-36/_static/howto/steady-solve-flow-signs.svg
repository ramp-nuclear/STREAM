<text x="275" y="104" text-anchor="middle" font-weight="bold">HXOut</text>
<text x="275" y="78" text-anchor="middle" fill="#555">outlet 38 °C</text>
<rect x="385" y="175" width="30" height="110" fill="#e8f1fb" stroke="#333" stroke-width="1.5"/>
