<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
  </defs>
  <rect width="1100" height="470" fill="#ffffff"/>

  <text x="20" y="28" font-size="15" font-weight="bold">(a) a level and its margin</text>
  <text x="620" y="28" font-size="15" font-weight="bold">(b) the ONB key</text>
  <text x="1080" y="28" fill="#555" font-style="italic" text-anchor="end">not to scale</text>

  <line x1="80" y1="400" x2="80" y2="62" stroke="#888" stroke-width="1" marker-end="url(#g)"/>
  <text x="88" y="66" fill="#555">heat flux [W/m²]</text>
  <line x1="80" y1="400" x2="560" y2="400" stroke="#888" stroke-width="1"/>
  <text x="72" y="404" fill="#555" text-anchor="end">0</text>

  <g stroke="#333" stroke-width="1.5">
    <line x1="80" y1="100" x2="560" y2="100"/>
    <line x1="80" y1="160" x2="560" y2="160"/>
    <line x1="80" y1="330" x2="560" y2="330" stroke="#1f5fbf" stroke-width="2"/>
  </g>
  <g font-weight="bold" text-anchor="end" fill="#333">
    <text x="72" y="104">CHF</text>
    <text x="72" y="164">0.8 CHF</text>
    <text x="72" y="334" fill="#1f5fbf">q, left</text>
  </g>
  <text x="556" y="94" fill="#555" text-anchor="end">Sudo_Kaminaga_CHF</text>
  <text x="556" y="154" fill="#555" text-anchor="end">factor(Sudo_Kaminaga_CHF, by=0.8)</text>
  <text x="556" y="350" fill="#555" text-anchor="end">wall flux of the cell</text>

  <line x1="120" y1="330" x2="120" y2="102" stroke="#d9480f" stroke-width="2.5" marker-end="url(#o)"/>
  <text x="132" y="208" font-weight="bold" fill="#d9480f">CHF − q, left</text>
  <text x="132" y="226" fill="#333">level margin, positive</text>
  <text x="132" y="242" fill="#333">while short of the threshold</text>

  <line x1="330" y1="330" x2="330" y2="162" stroke="#d9480f" stroke-width="2.5" marker-end="url(#o)"/>
  <text x="342" y="238" font-weight="bold" fill="#d9480f">0.8 CHF − q, left</text>
  <text x="342" y="256" fill="#333">a safety factor scales the level,</text>
  <text x="342" y="272" fill="#333">the margin follows</text>

  <line x1="680" y1="400" x2="680" y2="62" stroke="#888" stroke-width="1" marker-end="url(#g)"/>
  <text x="688" y="66" fill="#555">temperature [°C]</text>

  <g stroke="#333" stroke-width="1.5">
    <line x1="680" y1="130" x2="1070" y2="130"/>
    <line x1="680" y1="150" x2="1070" y2="150" stroke-dasharray="4,3"/>
    <line x1="680" y1="230" x2="1070" y2="230"/>
    <line x1="680" y1="350" x2="1070" y2="350" stroke="#1f5fbf" stroke-width="2"/>
  </g>
  <g font-weight="bold" text-anchor="end" fill="#333">
    <text x="640" y="134" text-anchor="start">T<tspan dy="4" font-size="9">ONB</tspan></text>
    <text x="647" y="234" text-anchor="start">T<tspan dy="4" font-size="9">sat</tspan></text>
    <text x="643" y="354" text-anchor="start" fill="#1f5fbf">T<tspan dy="4" font-size="9">wall</tspan></text>
  </g>

  <line x1="720" y1="228" x2="720" y2="132" stroke="#333" stroke-width="1.5" marker-start="url(#k)" marker-end="url(#k)"/>
  <text x="730" y="194" fill="#333" font-weight="bold">ΔT<tspan dy="4" font-size="9">ONB</tspan></text>

  <text x="880" y="168" fill="#555">onb_factor=0.8 scales ΔT<tspan dy="4" font-size="9">ONB</tspan><tspan dy="-4">:</tspan></text>
  <text x="880" y="186" fill="#555">T<tspan dy="4" font-size="9">ONB</tspan><tspan dy="-4"> drops toward the wall</tspan></text>
  <text x="880" y="204" fill="#555">and the key rises</text>

  <line x1="820" y1="132" x2="820" y2="348" stroke="#d9480f" stroke-width="2.5" marker-end="url(#o)"/>
  <text x="832" y="268" font-weight="bold" fill="#d9480f">T<tspan dy="4" font-size="9">wall</tspan><tspan dy="-4"> − T</tspan><tspan dy="4" font-size="9">ONB</tspan></text>
  <text x="832" y="286" fill="#333">the key itself, negative below</text>
  <text x="832" y="302" fill="#333">the onset, positive past it</text>

  <text x="550" y="448" fill="#333" font-size="13" text-anchor="middle">a level margin is positive while short of the threshold; the ONB key carries the opposite sign</text>
</svg>
